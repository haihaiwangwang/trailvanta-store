<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>TRAILVANTA Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f2eb;color:#1d3328;font:14px Arial,sans-serif}.top{background:#10271f;color:white;padding:18px max(18px,calc((100% - 1080px)/2));display:flex;justify-content:space-between}.top a{color:white}.wrap{max-width:1080px;margin:28px auto;padding:0 16px}.panel,.order{background:white;border:1px solid #dfe4d9;border-radius:7px;padding:20px;margin-bottom:15px}.login{max-width:420px;margin:12vh auto}input{display:block;width:100%;padding:12px;margin:8px 0 14px;border:1px solid #ccd5c9}.btn{border:0;border-radius:4px;padding:11px 14px;background:#183b2b;color:white;cursor:pointer}.danger{background:#913c30}.muted{color:#788477;font-size:12px}.err{color:#a33}.hidden{display:none!important}.head,.grid{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:15px 0}.items{background:#f5f6f1;padding:12px}.status{padding:10px;border:1px solid #ccd5c9;margin-right:8px}h1{font-size:23px}button,select{font:inherit}@media(max-width:600px){.panel,.order{padding:15px}.wrap{margin:16px auto}}
</style></head><body><header class="top"><b>TRAILVANTA / ADMIN</b><a href="/">View store ↗</a></header><main class="wrap">
<section id="login" class="panel login"><h1>Admin sign in</h1><p class="muted">Manage customer order requests.</p><form id="loginForm"><label>Admin password<input id="password" type="password" autocomplete="current-password" required></label><button class="btn" id="loginBtn">SIGN IN</button><p id="loginError" class="err"></p></form></section>
<section id="dash" class="hidden"><div class="panel head"><div><h1>Customer orders</h1><p class="muted">Latest 200 orders · Private customer details</p></div><button class="btn" id="logout">SIGN OUT</button></div><p id="message" class="muted"></p><div id="orders"></div></section></main>
<script>
const $=s=>document.querySelector(s),money=(n,c='USD')=>new Intl.NumberFormat('en-US',{style:'currency',currency:c||'USD'}).format((Number(n)||0)/100);
async function api(url,opt={}){let r=await fetch(url,{...opt,credentials:'same-origin',headers:{'Content-Type':'application/json',...(opt.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(login){$('#login').classList.toggle('hidden',!login);$('#dash').classList.toggle('hidden',login)}
function draw(list){$('#orders').innerHTML=list.length?list.map(o=>{let a={};try{a=JSON.parse(o.shipping_address_json||'{}')}catch{}return '<article class="order"><div class="head"><div><b>'+esc(o.order_no)+'</b><div class="muted">'+esc(o.created_at)+'</div></div><b>'+money(o.total_cents,o.currency)+'</b></div><div class="grid"><div><b>Customer</b><br>'+esc(o.customer_name)+'<br>'+esc(o.email)+'<br>'+esc(o.phone||'Phone not provided')+'</div><div><b>Shipping address</b><br>'+esc(a.address)+'<br>'+esc(a.city)+' '+esc(a.postal_code)+'<br>'+esc(a.country)+'</div><div><b>Amount</b><br>Subtotal '+money(o.subtotal_cents,o.currency)+'<br>Shipping '+money(o.shipping_cents,o.currency)+'<br>Tax '+money(o.tax_cents,o.currency)+'<br><b>Total '+money(o.total_cents,o.currency)+'</b></div></div><div class="items"><b>Products</b><ul>'+o.items.map(i=>'<li>'+esc(i.name)+' × '+esc(i.qty)+' — '+money(i.unit_price_cents,o.currency)+'</li>').join('')+'</ul></div><p>Status: <select class="status" data-status="'+o.id+'">'+['pending_payment','processing','shipped','completed','cancelled','refunded'].map(s=>'<option value="'+s+'" '+(o.status===s?'selected':'')+'>'+s.replace('_',' ')+'</option>').join('')+'</select><button class="btn" data-save="'+o.id+'">SAVE STATUS</button> <button class="btn danger" data-delete="'+o.id+'">DELETE ORDER</button></p></article>'}).join(''):'<div class="panel">No orders found.</div>'}
async function load(){try{let d=await api('/api/admin/orders');draw(d.orders||[]);show(false)}catch(e){if(e.message==='Unauthorized')show(true);else $('#message').textContent=e.message}}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();$('#loginBtn').disabled=true;try{await api('/api/admin/auth',{method:'POST',body:JSON.stringify({password:$('#password').value})});$('#password').value='';await load()}catch(e){$('#loginError').textContent=e.message}finally{$('#loginBtn').disabled=false}});
$('#orders').addEventListener('click',async e=>{let s=e.target.closest('[data-save]'),d=e.target.closest('[data-delete]');try{if(s){let id=s.dataset.save;await api('/api/admin/orders',{method:'PATCH',body:JSON.stringify({id,status:$('[data-status="'+id+'"]').value})});$('#message').textContent='Status updated.';await load()}if(d){let id=d.dataset.delete;if(!confirm('Permanently delete this order and its items?'))return;await api('/api/admin/orders',{method:'DELETE',body:JSON.stringify({id})});$('#message').textContent='Order deleted.';await load()}}catch(e){$('#message').textContent=e.message}});
$('#logout').addEventListener('click',async()=>{await api('/api/admin/logout',{method:'POST'});show(true)});load();
</script></body></html>
